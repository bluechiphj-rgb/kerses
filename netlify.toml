# netlify.toml

# Netlify 빌드 설정
[build]
  # Netlify Functions가 있는 디렉토리 지정
  functions = "netlify/functions"
  # 이 예제에서는 별도의 빌드 명령어가 필요하지 않으므로 비워둡니다.
  command = "# 빌드 명령어 없음 (정적 사이트 + 서버리스 함수)"
  # 배포할 정적 파일이 있는 디렉토리를 지정합니다. (루트 디렉토리)
  publish = "/"

# Netlify 리다이렉트/재작성 규칙 (Rewrites)
# 이 규칙은 특정 경로로 접속했을 때 내부적으로 Netlify Functions를 실행하도록 합니다.
# Cloudflare와 연동 시 Cloudflare를 통해서 이 경로로 접근하게 됩니다.

[[redirects]]
  from = "/500-error-test"      # 사용자가 접속할 URL
  to = "/.netlify/functions/error_500" # 실제 실행될 Netlify Function의 내부 경로
  status = 200                  # 내부 재작성(rewrite)을 의미합니다. (사용자에게는 500 에러가 반환됨)
  force = true                  # 항상 이 규칙을 적용합니다.

[[redirects]]
  from = "/504-timeout-test"    # 사용자가 접속할 URL
  to = "/.netlify/functions/error_504" # 실제 실행될 Netlify Function의 내부 경로
  status = 200                  # 내부 재작성(rewrite)을 의미합니다. (사용자에게는 504 에러가 반환됨)
  force = true                  # 항상 이 규칙을 적용합니다.
